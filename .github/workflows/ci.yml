name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (typecheck + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        # `--legacy-peer-deps` is required: the committed lockfile was produced
        # with it (the `prisma` CLI pulls in `@prisma/studio-core`, whose react
        # peer deps are not in the lockfile) and a plain `npm ci` refuses to
        # install an out-of-sync lockfile.
        run: npm ci --include=dev --legacy-peer-deps

      # The tests use mocked Prisma services — no database required.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test -- --runInBand

  frontend:
    name: Frontend (typecheck + production build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The tree resolves cleanly against React 19 (the editor is
      # `react-quill-new`, which supports React 16-19), so a plain `npm ci`
      # installs the lockfile as committed.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
